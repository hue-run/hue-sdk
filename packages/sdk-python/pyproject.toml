[project]
name = "hue-run"
version = "0.1.3"
description = "OpenTelemetry helpers for sending agent traces and correlated logs to Hue"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
keywords = ["opentelemetry", "otlp", "tracing", "observability", "llm", "ai-agents", "evaluation"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Operating System :: MacOS",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Libraries",
  "Topic :: System :: Monitoring",
  "Typing :: Typed",
]
dependencies = [
  # Tested floor 1.40.0 (CI resolves every direct dependency at its declared floor); uv.lock
  # records the certified combination. Keep in sync with hue_sdk/_otel_compat.py.
  "opentelemetry-api>=1.40,<2",
  "opentelemetry-sdk>=1.40,<2",
  "opentelemetry-exporter-otlp-proto-http>=1.40,<2",
  "requests>=2.32.5,<3",
]

[project.optional-dependencies]
# JSON Schema scoring (builtins.json_schema) runs jsonschema in an isolated worker process.
evals = ["jsonschema>=4.18,<5", "referencing>=0.28"]

[project.urls]
Homepage = "https://docs.hue.run"
Documentation = "https://docs.hue.run"
Repository = "https://github.com/hue-run/hue-sdk"
Changelog = "https://github.com/hue-run/hue-sdk/blob/main/CHANGELOG.md"
Issues = "https://github.com/hue-run/hue-sdk/issues"

[dependency-groups]
dev = [
  "pytest>=8.3,<10",
  "build>=1.2,<2",
  "ruff>=0.15,<1",
  "hatchling>=1.27,<2",
  "jsonschema==4.26.0",
  "referencing>=0.28",
  "mypy>=2.3,<3",
  "types-requests>=2.32,<3",
  "types-protobuf>=7.35,<8",
  "types-jsonschema>=4.26,<5",
  "pdoc>=15,<16",
]
compatibility = ["openai==3.14.0", "openinference-instrumentation-openai==0.1.60"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hue_sdk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
files = ["src/hue_sdk"]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true

[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-first-party = ["hue_sdk"]
