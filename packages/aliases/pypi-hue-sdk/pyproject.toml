[project]
name = "hue-sdk"
version = "0.2.3"
description = "Alias of hue-run. Install hue-run directly; this distribution only depends on it."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
dependencies = ["hue-run==0.2.3"]

[project.urls]
Homepage = "https://docs.hue.run"
Repository = "https://github.com/hue-run/hue-sdk"
Issues = "https://github.com/hue-run/hue-sdk/issues"

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hue_sdk_alias"]
