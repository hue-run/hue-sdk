name: Release SDK

on:
  workflow_dispatch:
    inputs:
      language:
        description: Package to prepare or publish
        required: true
        type: choice
        options: [typescript, python]
      version:
        description: Exact stable version already committed to main
        required: true
        type: string
      publish:
        description: Publish after verification (requires registry setup)
        default: false
        type: boolean
      npm_dist_tag:
        description: npm tag for TypeScript publication; ordinary releases keep latest
        default: latest
        type: choice
        options: [latest, hue-onboarding-candidate]
      prepared_run_id:
        description: Successful same-main-commit publish=false run to reuse without rebuilding (required for 0.4.0 publication)
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ inputs.language }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}
  NPM_DIST_TAG: ${{ inputs.npm_dist_tag }}
  PREPARED_RUN_ID: ${{ inputs.prepared_run_id }}

jobs:
  prepare:
    if: github.repository == 'hue-run/hue-sdk' && github.ref == 'refs/heads/main'
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate requested version before running package tools
        env:
          RELEASE_LANGUAGE: ${{ inputs.language }}
          RELEASE_PUBLISH: ${{ inputs.publish }}
        run: python3 scripts/release-policy.py
      - name: Require a changelog entry for the requested version
        env:
          RELEASE_LANGUAGE: ${{ inputs.language }}
        run: python3 scripts/changelog.py section "$RELEASE_LANGUAGE" "$RELEASE_VERSION"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        if: inputs.language == 'typescript'
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: inputs.language == 'typescript'
        with:
          bun-version-file: .bun-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5"
      - name: Build and test the exact TypeScript archive
        if: inputs.language == 'typescript' && inputs.prepared_run_id == ''
        run: node packages/sdk-typescript/scripts/verify-package.mjs --artifacts-dir .artifacts
      - name: Verify the accepted prepare-only producer run
        if: inputs.prepared_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify-prepared-release.py --run-id "$PREPARED_RUN_ID" --commit "$GITHUB_SHA" --version "$RELEASE_VERSION"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        if: inputs.prepared_run_id != ''
        with:
          name: release-typescript-${{ github.sha }}
          path: .artifacts
          run-id: ${{ inputs.prepared_run_id }}
          github-token: ${{ github.token }}
      - name: Recheck prepared identity and exact downloaded inventory
        if: inputs.prepared_run_id != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/verify-prepared-release.py --run-id "$PREPARED_RUN_ID" --commit "$GITHUB_SHA" --version "$RELEASE_VERSION" --artifacts .artifacts
      - name: Test unchanged accepted archive without GitHub credentials or rebuilding
        if: inputs.prepared_run_id != ''
        # Package/application children must never inherit the evidence-read token.
        run: env -u GH_TOKEN -u GITHUB_TOKEN node packages/sdk-typescript/scripts/verify-package.mjs --archive ".artifacts/hue-run-sdk-${RELEASE_VERSION}.tgz"
      - name: Check Python source and build distributions once
        if: inputs.language == 'python'
        working-directory: packages/sdk-python
        env:
          UV_PYTHON: "3.14"
        run: |
          uv sync --frozen --all-groups
          uv run --frozen --all-groups pytest
          uv run --frozen --all-groups ruff check src tests ../../examples/python-agent ../../examples/python-evaluation
          uv run --frozen --all-groups ruff format --check src tests ../../examples/python-agent ../../examples/python-evaluation
          uv run --frozen --all-groups mypy
          uv run --frozen --all-groups python -m build --no-isolation --outdir ../../.artifacts
          uvx --from twine==7.0.0 twine check --strict ../../.artifacts/*
      - name: Inspect package inventory and record checksums
        if: inputs.prepared_run_id == ''
        env:
          RELEASE_LANGUAGE: ${{ inputs.language }}
        run: python3 scripts/release-artifacts.py inspect "$RELEASE_LANGUAGE" "$RELEASE_VERSION" .artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-${{ inputs.language }}-${{ github.sha }}
          # The staging directory is hidden; upload only its inspected outputs.
          path: |
            .artifacts/*.tgz
            .artifacts/*.whl
            .artifacts/*.tar.gz
            .artifacts/release-manifest.json
            .artifacts/SHA256SUMS
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify-python:
    if: inputs.language == 'python'
    needs: prepare
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-python-${{ github.sha }}
          path: .artifacts
      - run: cd .artifacts && sha256sum --check SHA256SUMS
      - name: Test the same wheel in fresh pip and uv consumers
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: python3 scripts/verify-python-release.py --wheel ".artifacts/hue_run-${RELEASE_VERSION}-py3-none-any.whl" --python "$PYTHON_VERSION"

  publish-npm:
    if: inputs.publish && inputs.language == 'typescript'
    needs: prepare
    # npm Trusted Publishing requires GitHub-hosted runners.
    # https://docs.npmjs.com/trusted-publishers/
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
      id-token: write
    outputs:
      already-published: ${{ steps.registry.outputs.already-published }}
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-typescript-${{ github.sha }}
          path: .artifacts
      - run: cd .artifacts && sha256sum --check SHA256SUMS
      # A dispatch for a version npm already holds publishes nothing: the registry never takes other
      # bytes under a version, and accept-npm still checks the held bytes against this run's tested
      # archive, so a later job (the alias) can ship for a published version without republishing.
      - name: Check whether npm already holds this version
        id: registry
        run: |
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header 'Cache-Control: no-cache' "https://registry.npmjs.org/@hue-run%2fsdk/${RELEASE_VERSION}")"
          case "$status" in
            200) echo "already-published=true" >> "$GITHUB_OUTPUT"
                 echo "::notice::@hue-run/sdk@${RELEASE_VERSION} is already on npm; it is not published again" ;;
            404) echo "already-published=false" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::npm answered ${status} for @hue-run/sdk@${RELEASE_VERSION}"; exit 1 ;;
          esac
      # Trusted publishing needs npm >= 11.5.1; the version is exact-pinned and scripts are disabled.
      - run: npm install --global npm@11.15.0 --ignore-scripts --registry=https://registry.npmjs.org # zizmor: ignore[adhoc-packages]
      # OIDC trusted publishing is configured on the npm package. npm generates provenance
      # attestations only for a public source repository, and accept-npm requires them, so a
      # private-repository dispatch must fail here rather than after publishing.
      - name: Require a public source repository for npm provenance
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)"
          if [ "$visibility" != "public" ]; then
            echo "::error::npm provenance requires a public source repository (visibility: ${visibility}); make the repository public before publishing"
            exit 1
          fi
      - name: Publish the exact archive under the selected closed dist-tag
        if: steps.registry.outputs.already-published == 'false'
        run: npm publish ".artifacts/hue-run-sdk-${RELEASE_VERSION}.tgz" --tag "$NPM_DIST_TAG" --access public --ignore-scripts --registry=https://registry.npmjs.org

  publish-pypi:
    if: inputs.publish && inputs.language == 'python'
    needs: [prepare, verify-python]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-python-${{ github.sha }}
          path: .artifacts
      - name: Verify checksums and copy unchanged distributions
        run: |
          (cd .artifacts && sha256sum --check SHA256SUMS)
          mkdir dist
          cp ".artifacts/hue_run-${RELEASE_VERSION}-py3-none-any.whl" ".artifacts/hue_run-${RELEASE_VERSION}.tar.gz" dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true

  accept-npm:
    needs: [prepare, publish-npm]
    runs-on: blacksmith-4vcpu-ubuntu-2404
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-typescript-${{ github.sha }}
          path: .artifacts
      - name: Wait until npm serves the version and its dist-tag to this runner
        # npm answers from caches that lag a publish; poll, bounded, before reading it.
        run: python3 scripts/wait-for-registry.py typescript "$RELEASE_VERSION" --dist-tag "$NPM_DIST_TAG"
      - run: python3 scripts/release-artifacts.py registry typescript "$RELEASE_VERSION" .artifacts
      - name: Verify the published version carries npm provenance attestations
        run: |
          url="$(npm view "@hue-run/sdk@${RELEASE_VERSION}" dist.attestations.url --registry=https://registry.npmjs.org)"
          test -n "$url" && echo "attestations: $url"
      - name: Verify the selected dist-tag resolves to the accepted version
        run: |
          tagged="$(npm view "@hue-run/sdk@${NPM_DIST_TAG}" version --registry=https://registry.npmjs.org)"
          test "$tagged" = "$RELEASE_VERSION"
      - run: node packages/sdk-typescript/scripts/verify-package.mjs --registry-version "$RELEASE_VERSION"

  publish-npm-alias:
    # `hue-run` on npm re-exports @hue-run/sdk. It ships once the SDK version it pins is accepted
    # on npm, for ordinary `latest` releases only, so an activation candidate never reaches it.
    if: inputs.publish && inputs.language == 'typescript' && inputs.npm_dist_tag == 'latest'
    needs: accept-npm
    # npm Trusted Publishing requires GitHub-hosted runners.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: npm
    permissions:
      contents: read
      id-token: write
    outputs:
      accept: ${{ steps.alias.outputs.accept }}
    steps:
      # The alias is a handful of static re-export files: this job packs them from the release
      # commit and runs no repository script while it holds the publishing identity.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Require the alias at the released version, pinning exactly that SDK
        id: alias
        working-directory: packages/aliases/npm-hue-run
        run: |
          # verify-package.mjs already refused a release whose alias differs and tested the packed
          # alias against the archive; this rechecks the files this job packs.
          version="$(node -p 'require("./package.json").version')"
          pinned="$(node -p 'require("./package.json").dependencies["@hue-run/sdk"]')"
          if [ "$version" != "$RELEASE_VERSION" ] || [ "$pinned" != "$RELEASE_VERSION" ]; then
            echo "::error::hue-run ${version} pins @hue-run/sdk ${pinned}, not ${RELEASE_VERSION}"
            exit 1
          fi
          echo "accept=true" >> "$GITHUB_OUTPUT"
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' \
            --header 'Cache-Control: no-cache' "https://registry.npmjs.org/hue-run/${RELEASE_VERSION}")"
          case "$status" in
            200) echo "publish=false" >> "$GITHUB_OUTPUT"
                 echo "::notice::hue-run@${RELEASE_VERSION} is already on npm; it is not published again" ;;
            404) echo "publish=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error::npm answered ${status} for hue-run@${RELEASE_VERSION}"; exit 1 ;;
          esac
      # Trusted publishing needs npm >= 11.5.1; the version is exact-pinned and scripts are disabled.
      - if: steps.alias.outputs.publish == 'true'
        run: npm install --global npm@11.15.0 --ignore-scripts --registry=https://registry.npmjs.org # zizmor: ignore[adhoc-packages]
      - name: Require a public source repository for npm provenance
        if: steps.alias.outputs.publish == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          visibility="$(gh api "repos/${GITHUB_REPOSITORY}" --jq .visibility)"
          if [ "$visibility" != "public" ]; then
            echo "::error::npm provenance requires a public source repository (visibility: ${visibility})"
            exit 1
          fi
      - name: Publish the alias through trusted publishing
        if: steps.alias.outputs.publish == 'true'
        working-directory: packages/aliases/npm-hue-run
        run: npm publish --access public --ignore-scripts --registry=https://registry.npmjs.org

  accept-npm-alias:
    if: needs.publish-npm-alias.outputs.accept == 'true'
    needs: publish-npm-alias
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - name: Wait until npm serves the alias and its latest tag to this runner
        run: python3 scripts/wait-for-registry.py typescript "$RELEASE_VERSION" --npm-package hue-run
      - name: Verify the alias carries provenance and pins the released SDK
        run: |
          url="$(npm view "hue-run@${RELEASE_VERSION}" dist.attestations.url --registry=https://registry.npmjs.org)"
          if [ -z "$url" ]; then echo "::error::hue-run@${RELEASE_VERSION} carries no provenance attestations"; exit 1; fi
          echo "attestations: $url"
          pinned="$(npm view "hue-run@${RELEASE_VERSION}" "dependencies.@hue-run/sdk" --registry=https://registry.npmjs.org)"
          if [ "$pinned" != "$RELEASE_VERSION" ]; then echo "::error::hue-run@${RELEASE_VERSION} pins @hue-run/sdk ${pinned}"; exit 1; fi

  accept-pypi:
    needs: [prepare, publish-pypi]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-python-${{ github.sha }}
          path: .artifacts
      - name: Wait until PyPI's simple index lists both files to this runner
        # PyPI's index is cached for minutes after an upload; poll with pip's headers, bounded.
        run: python3 scripts/wait-for-registry.py python "$RELEASE_VERSION"
      - run: python3 scripts/release-artifacts.py registry python "$RELEASE_VERSION" .artifacts
      - env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: python3 scripts/verify-python-release.py --registry-version "$RELEASE_VERSION" --python "$PYTHON_VERSION"

  github-release:
    # Runs after whichever registry acceptance job applies to the selected language.
    if: ${{ !cancelled() && inputs.publish && (needs.accept-npm.result == 'success' || needs.accept-pypi.result == 'success') }}
    needs: [prepare, publish-npm, accept-npm, accept-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-${{ inputs.language }}-${{ github.sha }}
          path: .artifacts
      - run: cd .artifacts && sha256sum --check SHA256SUMS
      - name: Create or update the GitHub release from CHANGELOG.md and the tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_LANGUAGE: ${{ inputs.language }}
          ALREADY_PUBLISHED: ${{ needs.publish-npm.outputs.already-published }}
        run: |
          tag="${RELEASE_LANGUAGE}-v${RELEASE_VERSION}"
          # A dispatch for a version npm already held keeps the release the publishing run recorded.
          if [ "$ALREADY_PUBLISHED" = true ] && gh release view "$tag" > /dev/null 2>&1; then
            echo "::notice::${tag} already records the run that published ${RELEASE_VERSION}; left unchanged"
            exit 0
          fi
          if [ "$RELEASE_LANGUAGE" = typescript ]; then title="TypeScript SDK ${RELEASE_VERSION}"; else title="Python SDK ${RELEASE_VERSION}"; fi
          prerelease=""
          if [ "$RELEASE_LANGUAGE" = typescript ] && [ "$NPM_DIST_TAG" = hue-onboarding-candidate ]; then
            title="$title (activation candidate)"
            prerelease="--prerelease"
          fi
          python3 scripts/changelog.py notes "$RELEASE_LANGUAGE" "$RELEASE_VERSION" "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" .artifacts/SHA256SUMS > release-notes.md
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file release-notes.md $prerelease
            gh release upload "$tag" .artifacts/* --clobber
          else
            gh release create "$tag" .artifacts/* --target "$GITHUB_SHA" --title "$title" --notes-file release-notes.md $prerelease
          fi
