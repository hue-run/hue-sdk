name: Release SDK

on:
  workflow_dispatch:
    inputs:
      language:
        description: Package to prepare or publish
        required: true
        type: choice
        options: [typescript, python]
      version:
        description: Exact stable version already committed to main
        required: true
        type: string
      publish:
        description: Publish after verification (requires registry setup)
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: sdk-release-${{ inputs.language }}
  cancel-in-progress: false

env:
  RELEASE_VERSION: ${{ inputs.version }}

jobs:
  prepare:
    if: github.repository == 'hue-run/hue-sdk' && github.ref == 'refs/heads/main'
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate requested version before running package tools
        env:
          RELEASE_LANGUAGE: ${{ inputs.language }}
        run: |
          python3 - <<'PY'
          import json, os, pathlib, re, tomllib
          version = os.environ['RELEASE_VERSION']
          assert re.fullmatch(r'[0-9]+\.[0-9]+\.[0-9]+', version), 'Expected a stable package version'
          if os.environ['RELEASE_LANGUAGE'] == 'typescript':
              metadata = json.loads(pathlib.Path('packages/sdk-typescript/package.json').read_text())
          else:
              metadata = tomllib.loads(pathlib.Path('packages/sdk-python/pyproject.toml').read_text())['project']
          assert metadata['version'] == version, 'Version must match the committed package'
          PY
      - name: Require a changelog entry for the requested version
        env:
          RELEASE_LANGUAGE: ${{ inputs.language }}
        run: python3 scripts/changelog.py section "$RELEASE_LANGUAGE" "$RELEASE_VERSION"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        if: inputs.language == 'typescript'
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: inputs.language == 'typescript'
        with:
          bun-version-file: .bun-version
      - name: Build and test the exact TypeScript archive
        if: inputs.language == 'typescript'
        run: node packages/sdk-typescript/scripts/verify-package.mjs --artifacts-dir .artifacts
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        if: inputs.language == 'python'
        with:
          version: "0.12.5"
      - name: Check Python source and build distributions once
        if: inputs.language == 'python'
        working-directory: packages/sdk-python
        env:
          UV_PYTHON: "3.14"
        run: |
          uv sync --frozen --all-groups
          uv run --frozen --all-groups pytest
          uv run --frozen --all-groups ruff check src tests ../../examples/python-agent ../../examples/python-evaluation
          uv run --frozen --all-groups ruff format --check src tests ../../examples/python-agent ../../examples/python-evaluation
          uv run --frozen --all-groups mypy
          uv run --frozen --all-groups python -m build --no-isolation --outdir ../../.artifacts
          uvx --from twine==7.0.0 twine check --strict ../../.artifacts/*
      - name: Inspect package inventory and record checksums
        env:
          RELEASE_LANGUAGE: ${{ inputs.language }}
        run: python3 scripts/release-artifacts.py inspect "$RELEASE_LANGUAGE" "$RELEASE_VERSION" .artifacts
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-${{ inputs.language }}-${{ github.sha }}
          # The staging directory is hidden; upload only its inspected outputs.
          path: |
            .artifacts/*.tgz
            .artifacts/*.whl
            .artifacts/*.tar.gz
            .artifacts/release-manifest.json
            .artifacts/SHA256SUMS
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30

  verify-python:
    if: inputs.language == 'python'
    needs: prepare
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.5"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-python-${{ github.sha }}
          path: .artifacts
      - run: cd .artifacts && sha256sum --check SHA256SUMS
      - name: Test the same wheel in fresh pip and uv consumers
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: python3 scripts/verify-python-release.py --wheel ".artifacts/hue_run-${RELEASE_VERSION}-py3-none-any.whl" --python "$PYTHON_VERSION"

  publish-npm:
    if: inputs.publish && inputs.language == 'typescript'
    needs: prepare
    # npm Trusted Publishing requires GitHub-hosted runners.
    # https://docs.npmjs.com/trusted-publishers/
    runs-on: ubuntu-latest
    timeout-minutes: 5
    environment: npm
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-typescript-${{ github.sha }}
          path: .artifacts
      - run: cd .artifacts && sha256sum --check SHA256SUMS
      - run: npm install --global npm@11.15.0 --ignore-scripts --registry=https://registry.npmjs.org
      # OIDC trusted publishing is configured on the npm package. npm generates
      # provenance attestations automatically because the source repository is public.
      - run: npm publish ".artifacts/hue-run-sdk-${RELEASE_VERSION}.tgz" --access public --ignore-scripts --registry=https://registry.npmjs.org

  publish-pypi:
    if: inputs.publish && inputs.language == 'python'
    needs: [prepare, verify-python]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 5
    environment: pypi
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-python-${{ github.sha }}
          path: .artifacts
      - name: Verify checksums and copy unchanged distributions
        run: |
          (cd .artifacts && sha256sum --check SHA256SUMS)
          mkdir dist
          cp ".artifacts/hue_run-${RELEASE_VERSION}-py3-none-any.whl" ".artifacts/hue_run-${RELEASE_VERSION}.tar.gz" dist/
      - uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # v1.14.2
        with:
          packages-dir: dist/
          attestations: true

  accept-npm:
    needs: [prepare, publish-npm]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-typescript-${{ github.sha }}
          path: .artifacts
      - run: python3 scripts/release-artifacts.py registry typescript "$RELEASE_VERSION" .artifacts
      - name: Verify the published version carries npm provenance attestations
        run: |
          url="$(npm view "@hue-run/sdk@${RELEASE_VERSION}" dist.attestations.url --registry=https://registry.npmjs.org)"
          test -n "$url" && echo "attestations: $url"
      - run: node packages/sdk-typescript/scripts/verify-package.mjs --registry-version "$RELEASE_VERSION"

  accept-pypi:
    needs: [prepare, publish-pypi]
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          version: "0.12.5"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-python-${{ github.sha }}
          path: .artifacts
      - run: python3 scripts/release-artifacts.py registry python "$RELEASE_VERSION" .artifacts
      - env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: python3 scripts/verify-python-release.py --registry-version "$RELEASE_VERSION" --python "$PYTHON_VERSION"

  github-release:
    # Runs after whichever registry acceptance job applies to the selected language.
    if: ${{ !cancelled() && inputs.publish && (needs.accept-npm.result == 'success' || needs.accept-pypi.result == 'success') }}
    needs: [prepare, accept-npm, accept-pypi]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-${{ inputs.language }}-${{ github.sha }}
          path: .artifacts
      - run: cd .artifacts && sha256sum --check SHA256SUMS
      - name: Create or update the GitHub release from CHANGELOG.md and the tested artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_LANGUAGE: ${{ inputs.language }}
        run: |
          tag="${RELEASE_LANGUAGE}-v${RELEASE_VERSION}"
          if [ "$RELEASE_LANGUAGE" = typescript ]; then title="TypeScript SDK ${RELEASE_VERSION}"; else title="Python SDK ${RELEASE_VERSION}"; fi
          python3 scripts/changelog.py notes "$RELEASE_LANGUAGE" "$RELEASE_VERSION" "$GITHUB_SHA" \
            "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID" .artifacts/SHA256SUMS > release-notes.md
          if gh release view "$tag" > /dev/null 2>&1; then
            gh release edit "$tag" --title "$title" --notes-file release-notes.md
            gh release upload "$tag" .artifacts/* --clobber
          else
            gh release create "$tag" .artifacts/* --target "$GITHUB_SHA" --title "$title" --notes-file release-notes.md
          fi
