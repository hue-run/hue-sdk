name: SDK checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  release-tools:
    name: Release artifact boundaries
    runs-on: ${{ github.repository_owner == 'hue-run' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
  typescript:
    name: TypeScript installed package
    runs-on: ${{ github.repository_owner == 'hue-run' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
      - name: Audit locked dependencies
        working-directory: packages/sdk-typescript
        run: |
          bun install --frozen-lockfile
          bun audit --audit-level=high
      - run: node packages/sdk-typescript/scripts/verify-package.mjs --artifacts-dir .artifacts
        # The installed CLI matrix includes the existing published Flask runtime through uv.
        env:
          HUE_JUNIT_DIR: ${{ runner.temp }}/junit
      - name: Release inventory and syntax gate on the tested archive
        # The release workflow's own inspection, run on every change so a release never meets it first.
        run: |
          version=$(node -p 'require("./packages/sdk-typescript/package.json").version')
          python3 scripts/release-artifacts.py inspect typescript "$version" .artifacts
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: bun-test-junit-${{ github.run_id }}
          path: ${{ runner.temp }}/junit
          if-no-files-found: ignore
          retention-days: 14
  typescript-node-matrix:
    name: TypeScript installed package (Node ${{ matrix.node }})
    runs-on: ${{ github.repository_owner == 'hue-run' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
      - run: node packages/sdk-typescript/scripts/verify-package.mjs
  typescript-lint:
    name: TypeScript lint and format
    runs-on: ${{ github.repository_owner == 'hue-run' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Root tooling (eslint, prettier) plus the SDK's own dependencies for type-checked lint.
      - run: bun install --frozen-lockfile
      # Advisory for the lint/docs tooling; the published package's dependencies are audited as a
      # blocking step in the typescript job.
      - run: bun audit --audit-level=high
        continue-on-error: true
      - run: bun install --frozen-lockfile
        working-directory: packages/sdk-typescript
      - run: node scripts/write-version.mjs --check
        working-directory: packages/sdk-typescript
      - run: bun run lint
      - run: bun run format:check
  docs:
    name: Documentation checks
    runs-on: ${{ github.repository_owner == 'hue-run' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: packages/sdk-typescript
      - name: TypeScript API reference builds without warnings
        run: bun run docs:typescript
      - name: Python API reference builds
        working-directory: packages/sdk-python
        env:
          UV_PYTHON: "3.14"
        run: |
          uv sync --frozen --all-groups
          uv run --frozen --all-groups pdoc hue_sdk -o ../../docs/reference/python
      - name: Tracked Markdown names only current package versions
        run: python3 scripts/check-doc-versions.py
      - name: Generated documentation contract is current
        run: python3 scripts/generate-docs-contract.py --check
      - name: Markdown links resolve
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # npmjs.com rejects automated link-check requests with 403. Package/version freshness is
          # checked from the registry by Fern's ecosystem audit; keep only that known UI excluded.
          args: >-
            --no-progress --include-fragments
            --exclude-path node_modules --exclude-path docs/reference
            --exclude '^https://www\.npmjs\.com/package/@hue-run/sdk/?$'
            "./**/*.md"
          fail: true
  python:
    name: Python ${{ matrix.python }} source and installed wheel
    runs-on: ${{ github.repository_owner == 'hue-run' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
      - name: Frozen install, behavioral checks and package build
        working-directory: packages/sdk-python
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: |
          uv sync --frozen --all-groups
          uv run --frozen --all-groups pytest
          uv run --frozen --all-groups ruff check src tests ../../examples/python-agent ../../examples/python-evaluation
          uv run --frozen --all-groups ruff format --check src tests ../../examples/python-agent ../../examples/python-evaluation
          uv run --frozen --all-groups mypy
          uv run --frozen --all-groups python -m build --no-isolation --outdir ../../.artifacts
          uvx --from twine==7.0.0 twine check --strict ../../.artifacts/*
      - name: Release inventory gate and the release's fresh pip and uv consumers
        # The release workflow's own checks on the built distributions, run on every change so a
        # release never meets them first.
        env:
          PYTHON_VERSION: ${{ matrix.python }}
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("packages/sdk-python/pyproject.toml", "rb"))["project"]["version"])')
          python3 scripts/release-artifacts.py inspect python "$version" .artifacts
          python3 scripts/verify-python-release.py --wheel ".artifacts/hue_run-${version}-py3-none-any.whl" --python "$PYTHON_VERSION"
  python-lowest-bounds:
    name: Python ${{ matrix.python }} at the lowest OpenTelemetry bound
    runs-on: ${{ github.repository_owner == 'hue-run' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.5"
      # uv.lock stays the certified combination. This throwaway checkout re-resolves every direct
      # dependency at its declared floor (OpenTelemetry 1.40.0) and runs the same behavioral suite,
      # including the installed wheel; the regenerated lockfile is never committed.
      - name: Resolve direct dependencies at their floors and run the suite
        working-directory: packages/sdk-python
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: |
          uv lock --resolution lowest-direct
          uv sync --frozen --all-groups
          uv run --frozen --all-groups python -c 'from importlib.metadata import version; print(*(f"{name}=={version(name)}" for name in ("opentelemetry-api", "opentelemetry-sdk", "opentelemetry-exporter-otlp-proto-http", "requests", "pytest")), sep="\n")'
          uv run --frozen --all-groups pytest
  checks-passed:
    name: All checks passed
    if: always()
    needs: [release-tools, typescript, typescript-node-matrix, typescript-lint, python, python-lowest-bounds, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any required job did not succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          python3 -c 'import json, os, sys; r = json.loads(os.environ["RESULTS"]); bad = [k for k, v in r.items() if v["result"] != "success"]; sys.exit(f"failed: {bad}" if bad else 0)'
