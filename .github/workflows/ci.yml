name: SDK checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  release-tools:
    name: Release artifact boundaries
    runs-on: ${{ github.repository_owner == 'hue-run' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: python3 -m unittest discover -s scripts -p 'test_*.py'
  typescript-artifact:
    name: TypeScript candidate archive
    runs-on: ${{ github.repository_owner == 'hue-run' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - name: Audit locked dependencies
        working-directory: packages/sdk-typescript
        run: |
          bun install --frozen-lockfile
          bun audit --audit-level=high
      - name: Build the candidate archive and inspect its inventory
        run: |
          node packages/sdk-typescript/scripts/verify-package.mjs --profile pack --artifacts-dir .artifacts
          version=$(node -p 'require("./packages/sdk-typescript/package.json").version')
          python3 scripts/release-artifacts.py inspect typescript "$version" .artifacts
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-typescript-${{ github.sha }}
          path: .artifacts/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  typescript:
    name: TypeScript installed package
    runs-on: ${{ github.repository_owner == 'hue-run' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 30
    needs: typescript-artifact
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-typescript-${{ github.sha }}
          path: .artifacts
      - name: Verify broad behavior and every AI adapter against the candidate archive
        env:
          HUE_JUNIT_DIR: ${{ runner.temp }}/junit
        run: |
          (cd .artifacts && sha256sum --check SHA256SUMS)
          version=$(node -p 'require("./packages/sdk-typescript/package.json").version')
          node packages/sdk-typescript/scripts/verify-package.mjs --archive ".artifacts/hue-run-sdk-${version}.tgz"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: bun-test-junit-${{ github.run_id }}
          path: ${{ runner.temp }}/junit
          if-no-files-found: ignore
          retention-days: 14
  typescript-node-matrix:
    name: TypeScript installed package (Node ${{ matrix.node }})
    runs-on: ${{ github.repository_owner == 'hue-run' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 30
    needs: typescript-artifact
    strategy:
      fail-fast: false
      matrix:
        node: ["22", "26"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-typescript-${{ github.sha }}
          path: .artifacts
      - name: Verify the same archive on each Node runtime
        run: |
          (cd .artifacts && sha256sum --check SHA256SUMS)
          version=$(node -p 'require("./packages/sdk-typescript/package.json").version')
          node packages/sdk-typescript/scripts/verify-package.mjs --archive ".artifacts/hue-run-sdk-${version}.tgz" --profile runtime
  typescript-lint:
    name: TypeScript lint and format
    runs-on: ${{ github.repository_owner == 'hue-run' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      # Root tooling (eslint, prettier) plus the SDK's own dependencies for type-checked lint.
      - run: bun install --frozen-lockfile
      # Advisory for the lint/docs tooling; the published package's dependencies are audited as a
      # blocking step in the typescript-artifact job.
      - run: bun audit --audit-level=high
        continue-on-error: true
      - run: bun install --frozen-lockfile
        working-directory: packages/sdk-typescript
      - run: node scripts/write-version.mjs --check
        working-directory: packages/sdk-typescript
      - run: bun run lint
      - run: bun run format:check
  docs:
    name: Documentation checks
    runs-on: ${{ github.repository_owner == 'hue-run' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .bun-version
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5"
      - run: bun install --frozen-lockfile
      - run: bun install --frozen-lockfile
        working-directory: packages/sdk-typescript
      - name: TypeScript API reference builds without warnings
        run: bun run docs:typescript
      - name: Python API reference builds
        working-directory: packages/sdk-python
        env:
          UV_PYTHON: "3.14"
        run: |
          uv sync --frozen --all-groups
          uv run --frozen --all-groups pdoc hue_sdk -o ../../docs/reference/python
      - name: Tracked Markdown names only current package versions
        run: python3 scripts/check-doc-versions.py
      - name: Generated documentation contract is current
        run: python3 scripts/generate-docs-contract.py --check
      - name: Markdown files and fragments resolve without network requests
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: >-
            --offline --no-progress --include-fragments
            --exclude-path node_modules --exclude-path docs/reference
            --remap '^https://github\.com/hue-run/hue-sdk/(?:blob|tree)/main/(.*)$ file://${{ github.workspace }}/$1'
            "./**/*.md"
          fail: true
      - name: Own GitHub links resolve to the right Git ref and file kind
        shell: bash
        run: |
          lychee --dump --no-progress --exclude-path node_modules --exclude-path docs/reference "./**/*.md" |
            python3 scripts/check-repository-links.py
  python-artifact:
    name: Python candidate archive
    runs-on: ${{ github.repository_owner == 'hue-run' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5"
      - name: Build and inspect one wheel and source archive
        working-directory: packages/sdk-python
        env:
          UV_PYTHON: "3.14"
        run: |
          uv sync --frozen --all-groups
          uv run --frozen --all-groups python -m build --no-isolation --outdir ../../.artifacts
          uvx --from twine==7.0.0 twine check --strict ../../.artifacts/*
          version=$(uv run --frozen --all-groups python -c 'from importlib.metadata import version; print(version("hue-run"))')
          (cd ../.. && python3 scripts/release-artifacts.py inspect python "$version" .artifacts)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: candidate-python-${{ github.sha }}
          path: .artifacts/*
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
  python:
    name: Python ${{ matrix.python }} source and installed wheel
    runs-on: ${{ github.repository_owner == 'hue-run' && 'blacksmith-4vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 60
    needs: python-artifact
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5"
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: candidate-python-${{ github.sha }}
          path: .artifacts
      - name: Frozen install and source checks
        working-directory: packages/sdk-python
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: |
          uv sync --frozen --all-groups
          uv run --frozen --all-groups ruff check src tests ../../examples/python-agent ../../examples/python-evaluation
          uv run --frozen --all-groups ruff format --check src tests ../../examples/python-agent ../../examples/python-evaluation
          uv run --frozen --all-groups mypy
      - name: Installed behavior, packaging boundaries and fresh installer consumers
        env:
          PYTHON_VERSION: ${{ matrix.python }}
          UV_PYTHON: ${{ matrix.python }}
        run: |
          (cd .artifacts && sha256sum --check SHA256SUMS)
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("packages/sdk-python/pyproject.toml", "rb"))["project"]["version"])')
          export HUE_TEST_WHEEL="$GITHUB_WORKSPACE/.artifacts/hue_run-${version}-py3-none-any.whl"
          (cd packages/sdk-python && uv run --frozen --all-groups pytest tests/test_wheel.py tests/test_evaluations.py -k installed_wheel) &
          packaging_pid=$!
          python3 scripts/verify-python-release.py --wheel "$HUE_TEST_WHEEL" --python "$PYTHON_VERSION" &
          consumers_pid=$!
          checks_status=0
          wait "$packaging_pid" || checks_status=1
          wait "$consumers_pid" || checks_status=1
          exit "$checks_status"
  python-lowest-bounds:
    name: Python ${{ matrix.python }} at the lowest OpenTelemetry bound
    runs-on: ${{ github.repository_owner == 'hue-run' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.5"
      # uv.lock stays the certified combination. This throwaway checkout re-resolves every direct
      # dependency at its declared floor (OpenTelemetry 1.40.0) and runs the same behavioral suite,
      # including the installed wheel; the regenerated lockfile is never committed.
      - name: Resolve direct dependencies at their floors and run the suite
        working-directory: packages/sdk-python
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: |
          uv lock --resolution lowest-direct
          uv sync --frozen --all-groups
          uv run --frozen --all-groups python -c 'from importlib.metadata import version; print(*(f"{name}=={version(name)}" for name in ("opentelemetry-api", "opentelemetry-sdk", "opentelemetry-exporter-otlp-proto-http", "requests", "pytest")), sep="\n")'
          floor_artifacts="$RUNNER_TEMP/floor-artifacts"
          uv run --frozen --all-groups python -m build --no-isolation --outdir "$floor_artifacts"
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')
          export HUE_TEST_WHEEL="$floor_artifacts/hue_run-${version}-py3-none-any.whl"
          uv run --frozen --all-groups pytest -k 'not installed_wheel' &
          consumers_pid=$!
          uv run --frozen --all-groups pytest tests/test_wheel.py tests/test_evaluations.py -k installed_wheel &
          packaging_pid=$!
          checks_status=0
          wait "$packaging_pid" || checks_status=1
          wait "$consumers_pid" || checks_status=1
          exit "$checks_status"
  checks-passed:
    name: All checks passed
    if: always()
    needs: [release-tools, typescript-artifact, typescript, typescript-node-matrix, typescript-lint, python-artifact, python, python-lowest-bounds, docs]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fail if any required job did not succeed
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          echo "$RESULTS"
          python3 -c 'import json, os, sys; r = json.loads(os.environ["RESULTS"]); bad = [k for k, v in r.items() if v["result"] != "success"]; sys.exit(f"failed: {bad}" if bad else 0)'
