name: SDK checks
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sdk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  scenes-protocol:
    name: Scenes protocol fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.12.5"
      - run: uv run --python 3.14 --with jsonschema==4.26.0 python spec/scenes/v1/validate.py
  typescript:
    name: TypeScript installed package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: "24"
          package-manager-cache: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: 1.3.9
      - run: node packages/sdk-typescript/scripts/verify-package.mjs
  python:
    name: Python ${{ matrix.python }} source and installed wheel
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78
        with:
          version: "0.12.5"
      - name: Frozen install, behavioral checks and package build
        working-directory: packages/sdk-python
        env:
          UV_PYTHON: ${{ matrix.python }}
        run: |
          uv sync --frozen --all-groups
          uv run --frozen --all-groups pytest
          uv run --frozen --all-groups ruff check src tests ../../examples/python-agent ../../examples/python-evaluation
          uv run --frozen --all-groups python -m build --no-isolation
