name: Hosted documentation drift

on:
  schedule:
    - cron: "23 9 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hosted-docs-drift
  cancel-in-progress: true

jobs:
  live-docs:
    name: Unversioned docs.hue.run mirrors
    runs-on: ${{ github.repository_owner == 'hue-run' && 'blacksmith-2vcpu-ubuntu-2404' || 'ubuntu-latest' }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Public export contract is current
        run: python3 scripts/generate-docs-contract.py --check
      - name: Canonical documents match ordinary hosted URLs
        run: python3 scripts/check-docs-drift.py
      - name: Hosted API reference covers every public export
        run: python3 scripts/check-reference-coverage.py
      - name: Published Markdown links remain available
        if: always()
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          # npm's package UI rejects automated requests. Registry identity is checked separately.
          args: >-
            --no-progress --include-fragments
            --exclude-path node_modules --exclude-path docs/reference
            --exclude '^https://www\.npmjs\.com/package/@hue-run/sdk/?$'
            "./**/*.md"
          fail: true
