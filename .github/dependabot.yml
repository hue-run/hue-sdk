# Dependency and action updates with a supply-chain cooldown. TypeScript runtime
# dependencies are exact-pinned and Python's OpenTelemetry range is certified through
# uv.lock (see COMPATIBILITY.md); Dependabot surfaces the updates and installed-package
# verification in CI decides whether to take them.
version: 2
updates:
  - package-ecosystem: bun
    directory: /packages/sdk-typescript
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps(typescript)
    groups:
      opentelemetry:
        patterns:
          - "@opentelemetry/*"
  - package-ecosystem: uv
    directory: /packages/sdk-python
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: deps(python)
    groups:
      opentelemetry:
        patterns:
          - "opentelemetry-*"
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: ci
    groups:
      github-actions:
        patterns:
          - "*"
