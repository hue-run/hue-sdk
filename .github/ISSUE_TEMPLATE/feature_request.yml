name: Feature request
description: Propose an SDK capability. Check README "Scope and non-goals" first.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to observe, verify or evaluate, and what stops you today?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed API or behavior
      description: Prefer standard OpenTelemetry attributes, events and processors over Hue-specific protocols.
    validations:
      required: true
  - type: dropdown
    id: package
    attributes:
      label: Package
      multiple: true
      options:
        - "@hue-run/sdk (TypeScript)"
        - "hue-run (Python)"
        - Skill
        - Examples
        - Documentation
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Existing OpenTelemetry instrumentors, Collector processors or attach-to-provider mode you tried.
