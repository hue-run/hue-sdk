# Local hooks reuse the pinned tooling in the repository. Install with `pre-commit install`.
repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check (Python)
        entry: uv run --frozen --all-groups --project packages/sdk-python ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format (Python)
        entry: uv run --frozen --all-groups --project packages/sdk-python ruff format --check
        language: system
        types: [python]
      - id: mypy
        name: mypy (hue_sdk)
        entry: uv run --frozen --all-groups --project packages/sdk-python mypy
        language: system
        pass_filenames: false
        files: ^packages/sdk-python/src/
      - id: prettier
        name: prettier (TypeScript)
        entry: bun run format:check
        language: system
        pass_filenames: false
        files: \.(ts|mjs)$
      - id: eslint
        name: eslint (TypeScript)
        entry: bun run lint
        language: system
        pass_filenames: false
        files: \.(ts|mjs)$
